name: Deploy Supabase Migrations on Push

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - 'run-migrations.sh'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

jobs:
  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Secrets
        id: check-secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "has_access_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_access_token=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "has_db_password=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_db_password=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] && [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning title=Missing Secret::Please add SUPABASE_ACCESS_TOKEN (Personal Access Token from https://supabase.com/dashboard/account/tokens) to your GitHub repository secrets: Settings -> Secrets and variables -> Actions"
          fi

      - name: Run Migrations via Supabase Management API
        if: ${{ steps.check-secrets.outputs.has_access_token == 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID || 'pjpyfupkaubencuxnjyf' }}
        run: |
          sh run-migrations.sh

      - name: Set up Supabase CLI for Edge Functions
        if: ${{ steps.check-secrets.outputs.has_access_token == 'true' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy offer refresh Edge Function
        if: ${{ steps.check-secrets.outputs.has_access_token == 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID || 'pjpyfupkaubencuxnjyf' }}
        run: |
          deploy_failed=0
          for function_name in refresh-offers search-products refresh-tracked-products detect-fashion-items; do
            if ! supabase functions deploy "$function_name" --project-ref "$PROJECT_REF" --debug; then
              deploy_failed=1
            fi
          done
          exit "$deploy_failed"

      - name: Run Migrations via Supabase CLI (Fallback if DB Password provided)
        if: ${{ steps.check-secrets.outputs.has_access_token != 'true' && steps.check-secrets.outputs.has_db_password == 'true' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push via Supabase CLI
        if: ${{ steps.check-secrets.outputs.has_access_token != 'true' && steps.check-secrets.outputs.has_db_password == 'true' }}
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID || 'pjpyfupkaubencuxnjyf' }}" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
